<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Uma coisa importante</title>

    <style>
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #111;
            color: white;
            font-family: Arial, sans-serif;
            text-align: center;
        }

        .caixa {
            width: 400px;
            padding: 35px;
            border-radius: 20px;
            background: #1e1e1e;
            box-shadow: 0 0 30px #000;
        }

        button {
            padding: 15px 25px;
            margin: 8px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-size: 17px;
            transition: .2s;
        }

        button:hover {
            transform: scale(1.08);
        }

        #sim {
            background: #2ecc71;
            color: white;
        }

        #nao {
            background: #e74c3c;
            color: white;
        }

        #pizza {
            display: none;
            font-size: 100px;
            animation: girar 2s infinite linear;
        }

        @keyframes girar {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
    </style>
</head>

<body>

<div class="caixa">

    <h1 id="titulo">🚨 ATENÇÃO</h1>

    <p id="texto">
        Isabella, foi selecionada para receber uma mensagem extremamente importante.
    </p>

    <button id="sim" onclick="continuar()">CONTINUAR</button>

    <button id="nao" onclick="fugir()">Não quero</button>

    <div id="pizza">🍕</div>

</div>

<script>

let etapa = 0;

function continuar() {

    etapa++;

    if (etapa === 1) {
        document.getElementById("titulo").innerText = "🤨 Tem certeza?";
        document.getElementById("texto").innerText =
            "Essa decisão pode mudar completamente o rumo da sua vida.";
    }

    else if (etapa === 2) {
        document.getElementById("titulo").innerText = "⚠️ ÚLTIMA CHANCE";
        document.getElementById("texto").innerText =
            "Depois disso não tem como voltar atrás.";
    }

    else if (etapa === 3) {
        document.getElementById("titulo").innerText = "🍕 PARABÉNS";
        document.getElementById("texto").innerText =
            "Você ganhou uma pizza!";
        
        document.getElementById("pizza").style.display = "block";

        document.getElementById("sim").innerText = "COMER 🍕";
        document.getElementById("nao").style.display = "none";
    }

    else {
        document.getElementById("titulo").innerText = "";
        document.getElementById("texto").innerText =
            "A pizza foi comida. Obrigado por participar. Depois me manda o feedback lá no zap por favor, foi feito com muito carinho";
        
        document.getElementById("pizza").innerText = "💀";
    }
}

function fugir() {

    const botao = document.getElementById("nao (eu nao tentaria)");

    botao.style.position = "absolute";

    botao.style.left =
        Math.random() * (window.innerWidth - 150) + "px";

    botao.style.top =
        Math.random() * (window.innerHeight - 80) + "px";
}

</script>

</body>
</html>
