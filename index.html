<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Uma coisa importante 🍕</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;justify-content:center;align-items:center;background:#111;color:#fff;font-family:Arial,sans-serif;text-align:center;overflow:hidden}
.caixa{width:min(90%,430px);padding:35px;border-radius:22px;background:#1e1e1e;box-shadow:0 0 35px #000}
h1{font-size:32px}.pizza{font-size:95px;animation:girar 2s linear infinite;display:none}
button{padding:15px 24px;margin:8px;border:0;border-radius:10px;cursor:pointer;font-size:17px;transition:.2s}
button:hover{transform:scale(1.08)}
#sim{background:#2ecc71;color:white}#nao{background:#e74c3c;color:white}
#mensagem{min-height:30px;margin-top:18px;font-weight:bold}
@keyframes girar{from{transform:rotate(0)}to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="caixa">
<div id="pizza" class="pizza">🍕</div>
<h1 id="titulo">🚨 ATENÇÃO</h1>
<p id="texto">Você foi selecionada para receber uma mensagem extremamente importante.</p>
<button id="sim" onclick="continuar()">CONTINUAR</button>
<button id="nao" onclick="fugir()">Não quero</button>
<div id="mensagem"></div>
</div>
<script>
let etapa=0;
function continuar(){
 etapa++;
 const titulo=document.getElementById("titulo"), texto=document.getElementById("texto"), sim=document.getElementById("sim"), nao=document.getElementById("nao"), pizza=document.getElementById("pizza");
 if(etapa===1){titulo.innerText="🤨 Tem certeza?";texto.innerText="Essa decisão pode mudar completamente o rumo da sua vida."}
 else if(etapa===2){titulo.innerText="⚠️ ÚLTIMA CHANCE";texto.innerText="Depois disso não tem como voltar atrás."}
 else if(etapa===3){titulo.innerText="🍕 PARABÉNS";texto.innerText="Você ganhou uma pizza!";pizza.style.display="block";sim.innerText="COMER 🍕";nao.style.display="none"}
 else{titulo.innerText="💀";texto.innerText="A pizza foi comida. Obrigado por participar.";pizza.innerText="💀";sim.innerText="OK 😭";sim.onclick=()=>{texto.innerText="Você realmente clicou de novo KKKKKKK";sim.style.display="none"}}
}
function fugir(){
 const b=document.getElementById("nao");b.style.position="fixed";
 b.style.left=Math.random()*(innerWidth-150)+"px";b.style.top=Math.random()*(innerHeight-80)+"px";
}
</script>
</body>
</html>
